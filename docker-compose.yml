services:

  ollama:
    image: ollama/ollama:latest
    container_name: spotify_faq_ollama
    volumes:
      - ollama_data:/root/.ollama
    # Descomente se quiser acessar o Ollama também pelo host (ex: debug)
    # ports:
    #   - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - faq_network

  # Serviço "one-shot": sobe, baixa o modelo llama3.2 dentro do volume
  # compartilhado do Ollama e termina. O backend só inicia depois que
  # esse serviço completa com sucesso (evita erro "model not found").
  ollama-pull:
    image: ollama/ollama:latest
    container_name: spotify_faq_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2 && echo 'Modelo llama3.2 baixado com sucesso.'"]
    networks:
      - faq_network
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spotify_faq_backend
    ports:
      - "8000:8000"
    environment:
      # "ollama" é o nome do serviço acima — dentro da rede do compose,
      # o Docker resolve esse nome para o IP interno do container.
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - faq_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: spotify_faq_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - faq_network

volumes:
  ollama_data:

networks:
  faq_network:
    driver: bridge